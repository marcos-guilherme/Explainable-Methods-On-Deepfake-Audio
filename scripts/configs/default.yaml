run_name: default
seed: 42
device: auto
output_dir: results
data:
  dataset_id: AKCIT-Deepfake/BRSpeech-DF
  loader: auto
  train_split: train
  eval_split: test
  n_train_per_class: 1500
  n_test_per_class: 1500
  analysis_split: train
  n_analysis_per_class: 10000
adapt:
  # Padrão: holdout (head treina no train, análise no test) — distribuição
  # representativa onde o H3 tem erros para analisar. cross_fit=true (pool do train)
  # foi descartado: train é fácil demais e degenera o H3.
  cross_fit: false
  cv_folds: 5
  head: logistic
audio:
  sample_rate: 16000
  num_samples: 64600
model:
  checkpoint: nii-yamagishilab/mms-300m-anti-deepfake
  spoof_index: 0
bands:
  # Grade compartilhada por features (H1) e oclusão (H2). Aumente n_bands (ex.: 16, 24)
  # para mais resolução espectral; default 8 preserva a run de referência.
  n_bands: 8
  f_min: 20.0
  f_max: 7900.0
occlusion:
  per_quadrant: 150
  n_boot: 1000
association:
  top_n: 10
