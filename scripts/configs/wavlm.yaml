run_name: wavlm
seed: 42
device: auto
output_dir: results
data:
  dataset_id: AKCIT-Deepfake/BRSpeech-DF
  loader: auto
  train_split: train
  eval_split: test
  n_train_per_class: 1500
  n_test_per_class: 1500
  analysis_split: train
  n_analysis_per_class: 10000
adapt:
  cross_fit: false
  cv_folds: 5
  head: logistic
audio:
  sample_rate: 16000
  num_samples: 64600
model:
  # WavLM base como EXTRATOR de features (sem zero-shot), via o encoder genérico
  # hf_ssl (AutoModel + AutoProcessor). Só os hidden states interessam para o D_ad.
  encoder: hf_ssl
  checkpoint: microsoft/wavlm-base
  layer: -1          # camada oculta usada (−1 = última)
  pooling: mean
  spoof_index: 0     # ignorado por encoders sem zero-shot
bands:
  n_bands: 24
  f_min: 20.0
  f_max: 7900.0
occlusion:
  per_quadrant: 150
  n_boot: 1000
association:
  top_n: 10
