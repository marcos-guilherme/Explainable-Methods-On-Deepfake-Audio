run_name: hubert
seed: 42
device: auto
output_dir: results
data:
  dataset_id: AKCIT-Deepfake/BRSpeech-DF
  loader: auto
  train_split: train
  eval_split: test
  n_train_per_class: 1500
  n_test_per_class: 1500
  analysis_split: train
  n_analysis_per_class: 10000
adapt:
  cross_fit: false
  cv_folds: 5
  head: logistic
audio:
  sample_rate: 16000
  num_samples: 64600
model:
  # Encoder SSL do HuggingFace como EXTRATOR de features (sem zero-shot). O pipeline
  # produz só D_ad + H1/H2/H3; a comparação entre encoders sai do compare_encoders.py.
  encoder: hf_ssl
  checkpoint: facebook/hubert-base-ls960
  layer: -1          # camada oculta usada (−1 = última)
  pooling: mean
  spoof_index: 0     # ignorado por encoders sem zero-shot
bands:
  n_bands: 24
  f_min: 20.0
  f_max: 7900.0
occlusion:
  per_quadrant: 150
  n_boot: 1000
association:
  top_n: 10
