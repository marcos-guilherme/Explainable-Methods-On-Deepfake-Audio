[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmds-prepare"
version = "0.1.0"
description = "Reproducible English JMDS dataset preparation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "soundfile>=0.12",
    "zstandard>=0.25",
]

[project.scripts]
jmds-prepare = "jmds_prepare.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that require local data paths or long scans",
]
